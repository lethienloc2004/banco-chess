# Cloudflare Worker for Bàn Cờ: serves the app (dist/) and the online game server.
# Setup steps are in README.md ("Triển khai lên Cloudflare").
name = "ban-co"
main = "server/index.ts"
compatibility_date = "2025-09-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["GameRoom", "Lobby"]

[[d1_databases]]
binding = "DB"
database_name = "ban-co"
# Replace with the id printed by: npx wrangler d1 create ban-co
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# OAuth client id for "Sign in with Google" (leave empty to disable Google login).
GOOGLE_CLIENT_ID = ""
# Comma-separated Google emails that become admins when they sign in.
ADMIN_EMAILS = ""
